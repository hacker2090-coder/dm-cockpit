name: Check DM Cockpit Companion

on:
  push:
    branches: [main]
    paths:
      - "companion/**"
      - ".github/workflows/companion-ci.yml"
  pull_request:
    paths:
      - "companion/**"
      - ".github/workflows/companion-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: companion

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24.x"

      - name: Install dependencies
        run: npm install

      - name: Syntax check
        run: npm run check
