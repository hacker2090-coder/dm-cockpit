name: Build DM Cockpit

on:
  push:
    branches: [main]
    paths:
      - "module.json"
      - "scripts/**"
      - "templates/**"
      - "styles/**"
      - ".github/workflows/release.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Foundry package
        shell: bash
        run: |
          set -euo pipefail
          rm -rf work
          mkdir -p work
          unzip -q dm-cockpit.zip -d work

          VERSION=$(jq -r '.version' module.json)
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

          cp module.json work/dm-cockpit/module.json
          mkdir -p work/dm-cockpit/scripts
          if [ -d scripts ]; then cp -R scripts/. work/dm-cockpit/scripts/; fi
          if [ -d templates ]; then mkdir -p work/dm-cockpit/templates && cp -R templates/. work/dm-cockpit/templates/; fi
          if [ -d styles ]; then mkdir -p work/dm-cockpit/styles && cp -R styles/. work/dm-cockpit/styles/; fi

          rm -f dm-cockpit.zip
          cd work
          zip -qr ../dm-cockpit.zip dm-cockpit
          cd ..

      - name: Publish current package to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dm-cockpit.zip
          if git diff --cached --quiet; then
            echo "No package changes to publish."
          else
            git commit -m "Build DM Cockpit v${VERSION}"
            git push
          fi
