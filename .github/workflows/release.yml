name: Build DM Cockpit

on:
  push:
    branches: [main]
    paths:
      - "dm-cockpit-source.zip"
      - ".github/workflows/release.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Foundry package
        shell: bash
        run: |
          set -euo pipefail
          rm -rf src dist
          mkdir -p src dist/dm-cockpit
          unzip -q dm-cockpit-source.zip -d src

          VERSION=$(jq -r '.version' src/module.json)
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

          cp src/module.json dist/dm-cockpit/module.json
          cp -R src/scripts src/styles src/templates dist/dm-cockpit/
          if [ -d src/legacy-disabled ]; then cp -R src/legacy-disabled dist/dm-cockpit/; fi
          if [ -f src/README.md ]; then cp src/README.md dist/dm-cockpit/README.md; fi

          python - <<'PY'
          import json
          from pathlib import Path

          repo = 'hacker2090-coder/dm-cockpit'
          p = Path('dist/dm-cockpit/module.json')
          data = json.loads(p.read_text(encoding='utf-8'))
          data['url'] = f'https://github.com/{repo}'
          data['manifest'] = f'https://raw.githubusercontent.com/{repo}/main/module.json'
          data['download'] = f'https://raw.githubusercontent.com/{repo}/main/dm-cockpit.zip'
          text = json.dumps(data, ensure_ascii=False, indent=2) + '\n'
          p.write_text(text, encoding='utf-8')
          Path('module.json').write_text(text, encoding='utf-8')
          PY

          cd dist
          zip -qr dm-cockpit.zip dm-cockpit
          cd ..
          cp dist/dm-cockpit.zip dm-cockpit.zip

      - name: Publish current package to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add module.json dm-cockpit.zip
          if git diff --cached --quiet; then
            echo "No package changes to publish."
          else
            git commit -m "Build DM Cockpit v${VERSION}"
            git push
          fi
