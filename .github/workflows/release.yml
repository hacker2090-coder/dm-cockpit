name: Build DM Cockpit

on:
  push:
    branches: [main]
    paths:
      - "module.json"
      - "README.md"
      - "scripts/**"
      - "templates/**"
      - "styles/**"
      - ".github/workflows/release.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate versioned runtime sources
        shell: bash
        run: |
          set -euo pipefail
          jq -e '.id == "dm-cockpit" and (.version | type == "string")' module.json >/dev/null
          while IFS= read -r path; do
            test -f "$path" || { echo "Missing manifest source: $path"; exit 1; }
          done < <(jq -r '.esmodules[], .styles[]' module.json)
          test -f templates/cockpit.hbs
          find scripts -type f -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Build clean Foundry package
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(jq -r '.version' module.json)
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

          rm -rf build
          mkdir -p build/dm-cockpit
          cp module.json build/dm-cockpit/module.json
          if [ -f README.md ]; then cp README.md build/dm-cockpit/README.md; fi
          cp -R scripts build/dm-cockpit/scripts
          cp -R templates build/dm-cockpit/templates
          cp -R styles build/dm-cockpit/styles

          rm -f dm-cockpit.zip
          cd build
          zip -qr ../dm-cockpit.zip dm-cockpit
          cd ..
          rm -rf build

      - name: Publish current package to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dm-cockpit.zip
          if git diff --cached --quiet; then
            echo "No package changes to publish."
          else
            git commit -m "Build DM Cockpit v${VERSION}"
            git push
          fi
