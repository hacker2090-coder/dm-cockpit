name: Build DM Cockpit

on:
  push:
    branches: [main]
    paths:
      - "module.json"
      - "dm-cockpit-source.zip"
      - ".github/workflows/release.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Foundry package
        shell: bash
        run: |
          set -euo pipefail
          rm -rf src dist
          mkdir -p src dist/dm-cockpit
          unzip -q dm-cockpit-source.zip -d src

          VERSION=$(jq -r '.version' module.json)
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

          cp module.json dist/dm-cockpit/module.json
          cp -R src/scripts src/styles src/templates dist/dm-cockpit/
          if [ -d src/legacy-disabled ]; then cp -R src/legacy-disabled dist/dm-cockpit/; fi
          if [ -f src/README.md ]; then cp src/README.md dist/dm-cockpit/README.md; fi

          cd dist
          zip -qr dm-cockpit.zip dm-cockpit
          cd ..
          cp dist/dm-cockpit.zip dm-cockpit.zip

      - name: Publish current package to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dm-cockpit.zip
          if git diff --cached --quiet; then
            echo "No package changes to publish."
          else
            git commit -m "Build DM Cockpit v${VERSION}"
            git push
          fi
